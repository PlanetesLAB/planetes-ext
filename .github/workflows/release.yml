name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    uses: PlanetesLAB/release-workflows/.github/workflows/release.yml@v1
    with:
      manifest: Cargo.toml
      tag-prefix: v
      test-command: cargo test --all-features
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
